<!DOCTYPE html>
<html>

<head>
    <title>Registration Form Validation</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer>
    </script>
</head>

<body>

    <div id="container">
        <h1>Student Registration Form</h1>

        <form id="registrationForm">

            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter Full Name"><br>
            <span id="nameErr">
            </span><br>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter Email"><br>
            <span id="emailErr">
            </span><br>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password"><br>
            <span id="passwordErr">
            </span><br>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm Password"><br>
            <span id="confirmPasswordErr">
            </span><br>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="Enter Phone Number"><br>
            <span id="phoneErr">
            </span><br>

            <input type="submit" id="submit" value="Register">

            <p id="successMessage">
            </p>

        </form>
    </div>

</body>

</html>
