<!DOCTYPE html>
<html>

<head>
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer>
    </script>
</head>

<body>

    <div id="container">
        <h1>Travel Destination</h1>

        <div id="slider">

        <div id="buttonContainer">

            <button id="nextBtn">Next</button>
        </div>
    </div>

</body>

</html>
